name: satori
description: "Satori — 东方美学专注应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.8.0
  audioplayers: ^6.1.0
  just_audio: ^0.9.46
  vibration: ^2.0.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.4
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2815.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/white_noise/
    - assets/audio/instrumental_music/
    - assets/images/
